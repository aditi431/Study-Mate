services:
  - type: web
    name: studymate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

  - type: web
    name: studymate-web
    runtime: docker
    dockerfilePath: studymate-react/Dockerfile
    dockerContext: studymate-react

databases:
  - name: studymate-db
    plan: free
