services:
  - type: web
    name: studymate-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: studymate-web
    runtime: docker
    dockerfilePath: studymate-react/Dockerfile
    dockerContext: studymate-react
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: studymate-db
    plan: free
